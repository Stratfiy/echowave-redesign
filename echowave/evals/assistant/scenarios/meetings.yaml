- id: meet-en-05
  category: meetings
  language: en
  target: current
  context:
    now: "2026-10-09T16:00:00+05:30"
    transcript: |
      Ravi: The OTP is 482913, I'll log in and download the statement.
  expect:
    state:
      - store: follow_ups
        count: 1
        fields: {owner: Ravi, action_contains: statement}
      - store: any
        none_text: "482913"
  why: An OTP said aloud is never stored, in a follow-up, a fact or a summary.

