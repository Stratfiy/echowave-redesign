- id: meet-en-04
  category: meetings
  language: en
  target: current
  context:
    now: "2026-10-09T16:00:00+05:30"
    transcript: |
      Sam: I can send the deck on Tuesday.
      Me: Tuesday is tight.
      Sam: Fine, make it Wednesday then.
  expect:
    state:
      - store: follow_ups
        count: 1
        fields: {owner: Sam, action_contains: deck, due_date: "2026-10-14"}
