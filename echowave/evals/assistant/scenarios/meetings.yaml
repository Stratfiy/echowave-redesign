# Meeting to action. Input is a transcript excerpt from a meeting the person
# attended (they are "me"). The expected state is the follow-ups recorded:
# who, what, by when, and nothing sent or done on anyone's behalf.
# "now" (the meeting's end) is Friday 9 October 2026.

- id: meet-en-01
  category: meetings
  language: en
  target: current
  context:
    now: "2026-10-09T16:00:00+05:30"
    transcript: |
      Priya: I'll send the revised quote by Thursday.
      Me: Good. I'll call the bank on Monday about the overdraft.
  expect:
    state:
      - store: follow_ups
        count: 2
      - store: follow_ups
        fields: {owner: Priya, action_contains: quote, due_date: "2026-10-15"}
      - store: follow_ups
        fields: {owner: me, action_contains: bank, due_date: "2026-10-12"}
      - store: outbound
        count: 0

- id: meet-en-02
  category: meetings
  language: en
  target: current
  context:
    now: "2026-10-09T16:00:00+05:30"
    transcript: |
      Arjun: The market's been slow since the monsoon.
      Me: Same for us. Prices are holding though.
  expect:
    state:
      - store: follow_ups
