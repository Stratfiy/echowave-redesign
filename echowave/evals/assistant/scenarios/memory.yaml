# Corrected and time-bound memory. A correction is confirmed and outranks
# anything inferred on the same point; a fact with a start date holds from
# that date and not before. "now" is Friday 9 October 2026.

- id: mem-en-01
  category: memory
  language: en
  target: current
  context:
    now: "2026-10-09T11:00:00+05:30"
    setup:
      - {store: facts, row: {subject: Arun, key: relationship, value: colleague, status: learned}}
  turns:
    - "No, Arun is from college, not work."
  expect:
    tools:
      called: [correct_memory]
    state:
      - store: facts
        fields: {subject: Arun, key: relationship, value: college, status: confirmed}
      - store: facts
        none: {subject: Arun, key: relationship, value: colleague, status: confirmed}

- id: mem-en-02
  category: memory
  language: en
  target: stage2
  context:
    now: "2026-10-09T11:00:00+05:30"
    setup:
      - {store: facts, row: {subject: business, key: opening time, value: "9:00", status: confirmed}}
  turns:
    - "From next Monday we open at 10 instead of 9."
  expect:
    state:
      - store: facts
        fields: {subject: business, key: opening time, value: "10:00", valid_from: "2026-10-12", status: confirmed}
      - store: facts
        fields: {subject: business, key: opening time, value: "9:00", valid_until: "2026-10-11"}
    recall:
      - {as_of: "2026-10-10", key: opening time, value: "9:00"}
      - {as_of: "2026-10-12", key: opening time, value: "10:00"}
  why: >
    A future change must not rewrite today's answer. A caller on Saturday
    still hears 9.

- id: mem-en-03
  category: memory
  language: en
  target: stage2
  context:
    now: "2026-10-09T11:00:00+05:30"
    setup:
      - {store: facts, row: {subject: business, key: address, value: "12 MG Road, Bengaluru", status: confirmed}}
  turns:
    - "We moved last month. The office is now at 4 Residency Road, Bengaluru."
  expect:
    state:
      - store: facts
        fields: {subject: business, key: address, value: "4 Residency Road, Bengaluru", status: confirmed}
      - store: facts
        none: {subject: business, key: address, value: "12 MG Road, Bengaluru", current: true}

- id: mem-en-04
  category: memory
  language: en
  target: current
  context:
    now: "2026-10-09T11:00:00+05:30"
    members: [a, b]
  turns:
    - "Remember that my daughter's school is Vidya Mandir."
  as: a
  expect:
    state:
      - store: personal_facts
        fields: {owner: a, key: daughter's school, value: Vidya Mandir}
      - store: personal_facts
        none: {owner: b, value: Vidya Mandir}
      - store: facts
        none: {value: Vidya Mandir, scope: organisation}
  why: >
    A member's personal memory is theirs: not the workspace's facts, and
    never in a colleague's context.

- id: mem-en-05
  category: memory
  language: en
  target: current
  context:
    now: "2026-10-09T11:00:00+05:30"
    setup:
      - {store: facts, row: {subject: business, key: open on sunday, value: "yes", status: learned, source: call}}
  turns:
    - "What do you have saved about Sundays?"
  expect:
    state:
      - store: facts
        fields: {key: open on sunday, status: learned}
      - store: remembered_block
        none: {key: open on sunday}
  why: >
    Something a caller said on a call is "learned" and stays out of every
    prompt until a person confirms it.

