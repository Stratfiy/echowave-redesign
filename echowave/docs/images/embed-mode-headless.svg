<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A web page whose own custom button starts the call, with the Decibyl widget rendering no interface of its own">
  <style>
    .win  { fill: #ffffff; stroke: #d8dbe0; stroke-width: 1.5 }
    .bar  { fill: #f1f3f5 }
    .dot  { fill: #d0d4da }
    .blk  { fill: #e7e9ee }
    .ln   { fill: #dfe2e8 }
    .tx   { fill: #6b7280; font: 500 15px ui-sans-serif, system-ui, -apple-system, sans-serif }
    .txs  { fill: #8b90a0; font: 400 13px ui-sans-serif, system-ui, -apple-system, sans-serif }
    .code { fill: #6b7280; font: 400 13px ui-monospace, SFMono-Regular, Menlo, monospace }
    .ac   { fill: #0a6bc7 }
    .acs  { stroke: #0a6bc7 }
    .act  { fill: #ffffff; font: 600 15px ui-sans-serif, system-ui, -apple-system, sans-serif }
    .own  { fill: #7c3aed }
    .ghost{ fill: none; stroke: #b6bbc6; stroke-width: 1.5; stroke-dasharray: 5 4 }
    @media (prefers-color-scheme: dark) {
      .win  { fill: #14161a; stroke: #2b2f36 }
      .bar  { fill: #1b1e23 }
      .dot  { fill: #3a3f47 }
      .blk  { fill: #23272e }
      .ln   { fill: #2a2e35 }
      .tx   { fill: #9aa1ad }
      .txs  { fill: #7c838f }
      .code { fill: #9aa1ad }
      .ac   { fill: #28b3f0 }
      .acs  { stroke: #28b3f0 }
      .act  { fill: #05202f }
      .own  { fill: #a78bfa }
      .ghost{ stroke: #4a505a }
    }
  </style>
  <rect x="20" y="20" width="920" height="560" rx="12" class="win"/>
  <path d="M20 32a12 12 0 0 1 12-12h896a12 12 0 0 1 12 12v22H20z" class="bar"/>
  <circle cx="44" cy="37" r="5" class="dot"/>
  <circle cx="62" cy="37" r="5" class="dot"/>
  <circle cx="80" cy="37" r="5" class="dot"/>
  <rect x="104" y="30" width="200" height="14" rx="7" class="blk"/>
  <rect x="60" y="94" width="300" height="26" rx="6" class="blk"/>
  <rect x="60" y="136" width="560" height="12" rx="6" class="ln"/>
  <rect x="60" y="158" width="620" height="12" rx="6" class="ln"/>
  <rect x="60" y="180" width="430" height="12" rx="6" class="ln"/>

  <!-- the host page's own button, in the host page's own design -->
  <g transform="translate(60,232)">
    <rect x="0" y="0" width="230" height="56" rx="8" class="own"/>
    <text x="34" y="35" class="act">Speak to an advisor</text>
  </g>
  <text x="60" y="316" class="txs">your button, your design system, your framework</text>

  <rect x="60" y="356" width="400" height="140" rx="8" class="blk"/>
  <rect x="484" y="356" width="196" height="140" rx="8" class="blk"/>
  <rect x="60" y="524" width="620" height="12" rx="6" class="ln"/>

  <!-- what the widget contributes: an API, not an interface -->
  <g transform="translate(704,232)">
    <rect x="0" y="0" width="196" height="152" rx="10" class="ghost"/>
    <text x="20" y="34" class="txs">Decibyl renders</text>
    <text x="20" y="56" class="tx">nothing</text>
    <line x1="20" y1="76" x2="176" y2="76" class="acs" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="20" y="104" class="code">DecibylWidget</text>
    <text x="20" y="124" class="code">  .start()</text>
    <text x="20" y="144" class="code">  .end()</text>
  </g>
  <path d="M296 258h396" fill="none" class="acs" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M686 253l10 5-10 5z" class="ac"/>
</svg>
