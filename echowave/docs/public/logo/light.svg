<!--
  The docs wordmark, on a light background.

  The mark is the same waveform as the app icon (`ui/src/app/icon.svg`) and the
  same gradient, so the docs header, the browser tab and the dashboard all read
  as one product. It replaced an Arial `<text>` placeholder left over from the
  rebrand.
-->
<svg width="132" height="30" viewBox="0 0 132 30" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decibyl AI">
  <defs>
    <linearGradient id="dcb-mark-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28B3F0"/>
      <stop offset="1" stop-color="#0A6BC7"/>
    </linearGradient>
  </defs>
  <rect x="1" y="4" width="22" height="22" rx="6.6" fill="url(#dcb-mark-light)"/>
  <g stroke="#fff" stroke-width="1.43" stroke-linecap="round">
    <line x1="5.4" y1="15" x2="5.4" y2="15"/>
    <line x1="8.15" y1="12.25" x2="8.15" y2="17.75"/>
    <line x1="10.9" y1="9.5" x2="10.9" y2="20.5"/>
    <line x1="13.65" y1="6.75" x2="13.65" y2="23.25"/>
    <line x1="16.4" y1="9.5" x2="16.4" y2="20.5"/>
    <line x1="19.15" y1="12.25" x2="19.15" y2="17.75"/>
  </g>
  <text x="30" y="21" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="650" letter-spacing="-0.3" fill="#0B1220">Decibyl</text>
</svg>
