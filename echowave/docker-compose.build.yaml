# Build the API and UI images from this checkout instead of pulling them.
#
# THIS IS NO LONGER THE DEPLOY PATH. `.github/workflows/build-images.yml` builds
# both images in CI and pushes them to `ghcr.io/<owner>/decibyl-{api,ui}`, and
# the box pulls. Building on the box is what filled a 145GB disk to 82% with
# build cache and made every deploy compete with live calls for CPU.
#
# Use this override for LOCAL work, and for a machine that cannot reach the
# registry.
#
# The defaults are `ghcr.io/stratfiy` now -- the namespace this repository's
# own CI publishes to. They used to be `decibylai` and `ghcr.io/decibyl-hq`,
# registries nobody here controls holding *upstream's* build, so a stack run
# without REGISTRY set either failed to pull or, worse, succeeded and quietly
# ran somebody else's image with none of the billing, prepaid or GST work in
# it. Set REGISTRY only to point somewhere else.
#
# Use it whenever you are deploying your own code:
#
#     docker compose -f docker-compose.yaml -f docker-compose.build.yaml up -d --build
#
# The build context is the repository root for both images: the API Dockerfile
# needs the pipecat submodule alongside `api/`, and the UI Dockerfile copies
# from `ui/` by path. Run `git submodule update --init --recursive` first or the
# API build fails on a missing pipecat.
#
# Expect the first build to take a while — the UI compiles a Next.js production
# bundle and the API resolves a full Python dependency tree. Subsequent builds
# reuse layers.

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Local tag, so `docker compose up` finds the image just built rather than
    # going back to the registry for one that does not exist.
    image: decibyl-api:local
    pull_policy: never

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: decibyl-ui:local
    pull_policy: never
