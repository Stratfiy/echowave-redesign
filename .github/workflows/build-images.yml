# Build the api and ui images here, so the production box never builds anything.
#
# CURRENT STATE (7 Oct 2026, echowave/OPS-RUNBOOK.md section 2): the push
# trigger was removed (commit 8e52017), so this runs on manual dispatch only
# and nothing is built on merge; the box still builds its own images
# (ci_deploy.sh defaults to IMAGE_SOURCE=build). The notes below describe the
# intended state once ECR pushes are permitted and the trigger is restored.
#
# WHY THIS EXISTS. Deploys used to run `docker compose build` on the box. Two
# consequences, and the second is the expensive one:
#
#   1. Build cache accumulated until the disk was 82% full -- 419 entries,
#      116GB, on a 145GB volume. When that disk fills, Postgres cannot write,
#      calls cannot be costed and recordings cannot be saved, and the error
#      surfaces from whichever service happened to write next rather than from
#      the one at fault.
#
#   2. A Next.js production build saturates all four vCPU. THOSE ARE THE SAME
#      CORES THAT CARRY LIVE CALLS -- run_pipeline_telephony runs inside the
#      uvicorn workers -- so deploying during business hours degraded every
#      conversation in progress, and it presented as the model being slow.
#
# Building here fixes both by removing the builder from the box entirely. A
# deploy becomes `docker compose pull && up`, which is seconds and no CPU.
#
# It also makes rollback real. Every image is tagged with its commit SHA, so
# going back is `IMAGE_TAG=<sha> ./remote_up.sh` -- a pull, not a rebuild on a
# loaded four-core box.
#
# THIS FILE LIVES AT THE REPOSITORY ROOT, like deploy.yml and for the same
# reason: GitHub reads workflows from `<repo-root>/.github/workflows/` only,
# and this repository's root is echowave-redesign with the application under
# echowave/. It sat in echowave/.github/workflows/ from 2 Sept to 15 Sept and
# never ran once (KAN-35). Every path below is therefore prefixed echowave/.
#
# What this does NOT yet do: ci_deploy.sh still runs `docker compose build`
# on the box, because the box cannot reach a registry today (KAN-35 names the
# owner actions: a pull credential or ECR and an egress rule). Once it can,
# the deploy becomes `REGISTRY=ghcr.io/stratfiy docker compose pull && up`
# and the build step on the box goes. Until then these images are the
# rollback store and proof the Dockerfiles build clean on every merge.

name: Build images

on:
  
  workflow_dispatch:

# One build per ref. A second push while the first is still going cancels it:
# the older image is about to be replaced anyway, and two builds racing to push
# `latest` is how a box ends up running a commit nobody chose.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # For the OIDC exchange that gets a short-lived AWS credential. Deploy.yml
  # already assumes a role this way; pushing to ECR uses the same mechanism,
  # so no registry password exists anywhere in this repository or on the box.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # api and ui are independent, and one failing should not hide whether the
      # other is buildable.
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: echowave/api/Dockerfile
            # The application root, not the service directory: the API
            # Dockerfile needs pipecat/ beside api/.
            context: echowave
          - name: ui
            dockerfile: echowave/ui/Dockerfile
            # Same: the UI Dockerfile copies from ui/ by path.
            context: echowave
          # The third image, and the one that would have been missed. The box
          # builds api, ui *and* sandbox; publishing only the first two means
          # that the day the box stops building, `docker compose pull` finds
          # no sandbox image and the deploy fails on a service nobody was
          # thinking about.
          - name: sandbox
            dockerfile: echowave/sandbox/Dockerfile
            # Its own directory, unlike the other two: the sandbox Dockerfile
            # copies requirements.txt and server.py from the context root,
            # which is what compose gives it (`context: ./sandbox`). Building
            # it from echowave/ would fail on the first COPY.
            context: echowave/sandbox

    steps:
      - name: Check out, with pipecat
        uses: actions/checkout@v4
        with:
          # THE API BUILD FAILS WITHOUT THIS. pipecat is a submodule and the
          # API Dockerfile installs from it; a default checkout leaves the
          # directory empty and the failure reads like a broken dependency
          # rather than a missing checkout flag.
          submodules: recursive

      - name: Registry namespace
        id: ns
        # GHCR rejects an uppercase path, and the owner here is "Stratfiy".
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ECR is where the box pulls from. GHCR stays as well: it costs
      # nothing, it is where a developer without AWS can pull from, and a
      # second copy of a release is not a bad thing to have.
      #
      # OIDC, not a stored key. The box authenticates to ECR with its own
      # instance role and this workflow with a role it assumes per run, so at
      # no point does a registry password exist to be leaked or rotated --
      # which is the whole reason for choosing ECR over a GHCR token on the
      # box.
      - name: Authenticate to AWS
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Log in to ECR
        id: ecr
        # Best-effort, like the step above: until the repositories and the
        # IAM permission exist, this workflow must keep publishing to GHCR
        # rather than turning red on every merge.
        #
        # Logging in is NOT the same as being allowed to push, and that gap
        # is what turned this job red on every merge from 15 Sept. The role
        # can `ecr:GetAuthorizationToken`, so this step succeeds; it cannot
        # `ecr:BatchGetImage` on the repositories, so the push that followed
        # failed -- inside the one step that also pushed GHCR, taking the
        # whole job down with it. The ECR push is its own step now, below.
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          # The application root for both, not the service directory: the API
          # Dockerfile needs pipecat/ beside api/, and the UI Dockerfile copies
          # from ui/ by path. Not the repository root either -- the Dockerfiles
          # were written when echowave/ was the root and address api/ and ui/
          # from there.
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # The box is x86. Building arm64 as well would roughly double the
          # build for an architecture nothing runs.
          platforms: linux/amd64
          # Both registries in one build, so the two can never hold
          # different code under the same SHA.
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/decibyl-${{ matrix.name }}:latest
            ghcr.io/${{ steps.ns.outputs.owner }}/decibyl-${{ matrix.name }}:${{ github.sha }}
          # Cache lives with the Actions runner, not on the production disk,
          # which is the entire point of moving the build here.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

      # ECR is where the box pulls from, and it is the half that is not
      # permitted yet. Its own step, so a denied push leaves this job amber
      # on one step instead of red on the merge: the image still exists in
      # GHCR, which is what the rollback store and the buildable-Dockerfile
      # proof actually need. The layers are already built and cached, so
      # this costs seconds.
      #
      # TO TURN THIS GREEN, on the DecibylGitHubDeploy role, for the three
      # decibyl-* repositories: ecr:BatchGetImage,
      # ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability,
      # ecr:InitiateLayerUpload, ecr:UploadLayerPart,
      # ecr:CompleteLayerUpload, ecr:PutImage. The role has the account-level
      # ecr:GetAuthorizationToken already, which is why the login above
      # succeeds and only the push is refused.
      - name: Push to ECR
        if: steps.ecr.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.registry }}/decibyl-${{ matrix.name }}:latest
            ${{ steps.ecr.outputs.registry }}/decibyl-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          provenance: false

      - name: Say what to deploy
        run: |
          echo "::notice title=Image published::ghcr.io/${{ steps.ns.outputs.owner }}/decibyl-${{ matrix.name }}:${{ github.sha }}"
