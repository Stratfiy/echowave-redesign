name: Desktop app

# The Windows and Mac app (echowave/desktop).
#
# On every change to it: typecheck and the vitest suite (no Electron or
# display needed: the computer-use loop runs against a fake driver).
#
# By hand (workflow_dispatch): build the packages on the systems that can.
# Windows on windows-latest; macOS on macos-latest, because the .dmg, code
# signing and notarisation need Apple's tools. Signed when the secrets are
# set, unsigned otherwise; the build log says which. Nothing is published
# unless `publish` is ticked and DECIBYL_UPDATE_URL is set.

on:
  pull_request:
    branches: [main]
    paths:
      - "echowave/desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to the update feed (needs DECIBYL_UPDATE_URL)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64, ci]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: echowave/desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  package-windows:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: echowave/desktop
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      DECIBYL_UPDATE_URL: ${{ vars.DECIBYL_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node scripts/package.mjs win ${{ inputs.publish && '--publish' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: decibyl-windows
          path: |
            echowave/desktop/release/*.exe
            echowave/desktop/release/*.yml
          retention-days: 14

  package-macos:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: echowave/desktop
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      DECIBYL_UPDATE_URL: ${{ vars.DECIBYL_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Write the notarisation key (only when the secret is set)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - run: node scripts/package.mjs mac ${{ inputs.publish && '--publish' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: decibyl-macos
          path: |
            echowave/desktop/release/*.dmg
            echowave/desktop/release/*.zip
            echowave/desktop/release/*.yml
          retention-days: 14
