name: Deploy

# Deploys to the EC2 box over AWS Systems Manager.
#
# **No SSH key, and no long-lived AWS credentials.** The runner assumes an IAM
# role through GitHub's OIDC provider, which mints a token good for this run
# only, and then hands the deploy to SSM. Consequences worth knowing:
#
#   * Port 22 can stay closed to the world. SSM works outbound-only, over the
#     agent already on the instance.
#   * There is no key to leak, rotate, or paste into a chat window. The trust is
#     a policy binding "this repo, this branch" to a role, revocable in one IAM
#     change rather than on every machine that trusted a key.
#   * Every command is in CloudTrail with the identity that ran it.
#
# One-time AWS setup is in echowave/docs/DEPLOY-GITHUB-ACTIONS.md. Until that
# is done this workflow cannot authenticate and will fail at the first step,
# which is the intended behaviour — it should not fall back to anything weaker.
#
# **This file has to live at the repository root, not under echowave/.**
# GitHub only reads workflows from `<repo-root>/.github/workflows/`, and this
# repository's root is echowave-redesign with the application one level down.
# The seven workflows still sitting in echowave/.github/workflows/ are inherited
# from upstream, where echowave *was* the root, and not one of them has ever
# run here — `actions_list` on this repository returns zero workflows. A deploy
# workflow that never fires is worse than no deploy workflow: it looks like
# automation while every push goes nowhere.

on:
  push:
    branches: [main]
    # Prefixed with echowave/, because these are matched against paths from the
    # repository root and the application is a directory down.
    paths-ignore:
      - "**/*.md"
      - "echowave/docs/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to deploy (defaults to the branch this is run from)"
        required: false
        type: string

# One deploy at a time. Two overlapping runs would race on the same checkout and
# leave the box on whichever finished last, which is not necessarily the newest.
# Not cancel-in-progress: a half-finished deploy is worse than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to request the OIDC token

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production # gate approvals/secrets here if you want them
    timeout-minutes: 25

    steps:
      - name: Resolve the ref being deployed
        id: target
        run: echo "ref=${{ inputs.ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Send the deploy to the instance
        id: send
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DEPLOY_REF: ${{ steps.target.outputs.ref }}
          # Where the clone lives on the box. Set as a repo variable if it is
          # not the default.
          PROJECT_DIR: ${{ vars.DEPLOY_PROJECT_DIR || '/home/ubuntu/echowave-redesign/echowave' }}
          RUN_AS: ${{ vars.DEPLOY_RUN_AS || 'ubuntu' }}
        run: |
          set -euo pipefail
          # Built as a JSON file rather than inline. The inline form needs
          # backslash-escaped quotes inside a shell string inside YAML, and a
          # deploy that fails on a quoting mistake fails in the least
          # diagnosable way there is.
          #
          # SSM's AWS-RunShellScript already runs as root, so no sudo here;
          # ci_deploy.sh hands ownership back to RUN_AS when it finishes.
          #
          # The safe.directory line is deliberately here and not only in
          # ci_deploy.sh. SSM runs as root against a checkout owned by RUN_AS,
          # and git refuses to touch a repository it does not own — which it
          # decides before running the checked-out script's own copy of this
          # fix. A box whose checkout predates that fix therefore cannot deploy
          # the commit that contains it. This file is read from the repository
          # at dispatch time rather than from the instance, so putting it here
          # makes the deploy self-healing on any box, however stale.
          jq -n \
            --arg dir "$PROJECT_DIR" \
            --arg ref "$DEPLOY_REF" \
            --arg user "$RUN_AS" \
            '{commands: [
               "set -euo pipefail",
               "git config --system --replace-all safe.directory \"*\" || true",
               "cd \($dir)",
               "REF=\($ref) PROJECT_DIR=\($dir) RUN_AS=\($user) bash \($dir)/scripts/ci_deploy.sh"
             ]}' > /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "gha deploy ${DEPLOY_REF} run ${{ github.run_id }}" \
            --timeout-seconds 1200 \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $COMMAND_ID for ref $DEPLOY_REF"

      - name: Wait for it, and stream the result
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail
          # aws ssm wait command-executed caps at 100 attempts x 5s and gives no
          # output while it waits; polling ourselves lets the log show progress
          # and lets us print stdout on either outcome.
          for _ in $(seq 1 200); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "CommandInvocations[0].Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 6
          done

          echo "::group::Deploy output"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "::endgroup::"

          ERR=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true)
          if [ -n "$ERR" ] && [ "$ERR" != "None" ]; then
            echo "::group::stderr"
            echo "$ERR"
            echo "::endgroup::"
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy finished as $STATUS. The box rolled itself back to the previous commit — see the output above."
            exit 1
          fi
          echo "Deploy succeeded."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy — ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Ref | \`${{ steps.target.outputs.ref }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| SSM command | \`${{ steps.send.outputs.command_id }}\` |"
            echo "| Actor | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
